<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXNIHILO vs Competition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }

  .card {
    background: linear-gradient(135deg, #12121a 0%, #0d0d14 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 24px;
    padding: 48px 56px;
    max-width: 820px;
    width: 100%;
    box-shadow: 0 0 80px rgba(99, 102, 241, 0.06);
  }

  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 40px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }

  thead th {
    padding: 16px 20px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  thead th:first-child {
    text-align: left;
    color: rgba(255,255,255,0.25);
  }

  thead th.highlight {
    color: #818cf8;
    position: relative;
  }

  thead th.highlight::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #818cf8, transparent);
  }

  tbody tr {
    transition: background 0.2s;
  }

  tbody tr:hover {
    background: rgba(255,255,255,0.015);
  }

  tbody td {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    vertical-align: middle;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  tbody td:first-child {
    text-align: left;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
    font-size: 15px;
  }

  /* EXNIHILO column highlight */
  tbody td.ex {
    color: #fff;
    position: relative;
  }

  tbody td.ex::before {
    content: '';
    position: absolute;
    inset: 4px 8px;
    background: rgba(99, 102, 241, 0.06);
    border-radius: 12px;
    z-index: 0;
  }

  tbody td.ex .cell {
    position: relative;
    z-index: 1;
  }

  /* Check / X icons */
  .check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.12);
    color: #22c55e;
    font-size: 16px;
    font-weight: 700;
  }

  .cross {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.08);
    color: rgba(239, 68, 68, 0.5);
    font-size: 15px;
    font-weight: 600;
  }

  .tag {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .tag-green {
    background: rgba(34, 197, 94, 0.1);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.15);
  }

  .tag-red {
    background: rgba(239, 68, 68, 0.06);
    color: rgba(239, 68, 68, 0.55);
    border: 1px solid rgba(239, 68, 68, 0.08);
  }

  .tag-neutral {
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .unlimited {
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.3px;
  }

  .leverage-other {
    color: rgba(255,255,255,0.35);
    font-weight: 600;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot-ex { background: #818cf8; }
  .dot-bn { background: #f0b90b; }
  .dot-hl { background: #6ee7b7; }
</style>
</head>
<body>
  <div class="card">
    <h1>Why EXNIHILO?</h1>
    <p class="subtitle">A new standard for perpetual trading</p>

    <table>
      <thead>
        <tr>
          <th>Feature</th>
          <th class="highlight">
            <span class="logo-row"><span class="logo-dot dot-ex"></span> EXNIHILO</span>
          </th>
          <th>
            <span class="logo-row"><span class="logo-dot dot-bn"></span> Binance</span>
          </th>
          <th>
            <span class="logo-row"><span class="logo-dot dot-hl"></span> Hyperliquid</span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Trade any token</td>
          <td class="ex"><div class="cell"><span class="check">&#10003;</span></div></td>
          <td><span class="cross">&#10005;</span></td>
          <td><span class="cross">&#10005;</span></td>
        </tr>
        <tr>
          <td>Max leverage</td>
          <td class="ex"><div class="cell"><span class="unlimited">Unlimited</span></div></td>
          <td><span class="leverage-other">125x</span></td>
          <td><span class="leverage-other">50x</span></td>
        </tr>
        <tr>
          <td>Position type</td>
          <td class="ex"><div class="cell"><span class="tag tag-green">Tradable NFT</span></div></td>
          <td><span class="tag tag-neutral">Account-bound</span></td>
          <td><span class="tag tag-neutral">Account-bound</span></td>
        </tr>
        <tr>
          <td>Liquidation</td>
          <td class="ex"><div class="cell"><span class="tag tag-green">None</span></div></td>
          <td><span class="tag tag-red">You're the prey</span></td>
          <td><span class="tag tag-red">You're the prey</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
