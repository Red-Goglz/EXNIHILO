# Restart policy for the Postgres cluster.
#
# Install to /etc/systemd/system/postgresql@.service.d/restart.conf — the
# template's drop-in directory, so it applies to every cluster instance
# (postgresql@16-main and any future major version) rather than one of them.
#
# ── Read this before keeping it ──────────────────────────────────────────────
# Debian ships postgresql@.service with Restart= commented out *on purpose*:
#
#   # restarting automatically will prevent "pg_ctlcluster ... stop" from
#   # working, so we disable it here. Also, the postmaster will restart by
#   # itself on most problems anyway
#
# Both halves of that are true and this file overrides them knowingly:
#
#   - `pg_ctlcluster 16 main stop` run directly will now be undone by systemd,
#     which sees the postmaster's PID vanish and starts it again. Stop the
#     database with `systemctl stop postgresql@16-main` instead. Package
#     upgrades are unaffected — postgresql-common's maintainer scripts go
#     through invoke-rc.d, which redirects to systemctl.
#   - The postmaster already restarts crashed *backends* itself, and
#     OOMScoreAdjust=-900 in the packaged unit keeps the OOM killer away from
#     the postmaster. So this only covers postmaster death, which is rare.
#
# It earns its place anyway because of what sits downstream: the indexer
# crash-loops for as long as the database is gone, and its backoff tops out at
# five minutes. An unattended postmaster death would otherwise mean the API
# stays down until someone looks at it.
#
# To back this out: rm the file, `systemctl daemon-reload`.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# ExecStart in the packaged unit is prefixed with `-` (ignore failure, because
# crash recovery can take arbitrarily long), so a cluster that fails to *start*
# does not trigger this. What it catches is a postmaster that dies after having
# come up — which is the case worth covering.
Restart=on-failure
RestartSec=10s
