# Restart policy for Caddy.
#
# Install to /etc/systemd/system/caddy.service.d/restart.conf — a drop-in, not
# an edit of /usr/lib/systemd/system/caddy.service, which the caddy package
# overwrites on every upgrade.
#
# The packaged unit has no Restart= line at all, so it defaults to Restart=no:
# if Caddy dies, the site *and* the indexer proxy stay down until a human
# notices. Caddy is stable enough that this rarely fires, which is exactly what
# makes it a bad thing to leave unset — the one time it matters, nobody is
# watching.

[Unit]
# StartLimit* belong in [Unit]. systemd accepts them nowhere else and only says
# so as a log line ("Unknown key name ... in section 'Service', ignoring"), so a
# misplaced limit looks configured while doing nothing.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# on-failure, not always: a clean `systemctl stop caddy` must stay stopped.
Restart=on-failure
RestartSec=5s
